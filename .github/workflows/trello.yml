name: Trello

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  stiahni:
    runs-on: ubuntu-latest
    steps:
      # web beží z vetvy 01-web-setup, preto sa trello.json zapisuje tam
      - uses: actions/checkout@v4
        with:
          ref: 01-web-setup

      - name: Stiahni board z Trella
        env:
          TRELLO_KEY: ${{ secrets.TRELLO_KEY }}
          TRELLO_TOKEN: ${{ secrets.TRELLO_TOKEN }}
          BOARD_ID: wvPm4USn
        run: |
          # secrety môžu obsahovať neviditeľné znaky (BOM, nový riadok), nechávame len písmená a čísla
          TRELLO_KEY=$(printf %s "$TRELLO_KEY" | tr -cd 'A-Za-z0-9')
          TRELLO_TOKEN=$(printf %s "$TRELLO_TOKEN" | tr -cd 'A-Za-z0-9')
          echo "dĺžka kľúča: ${#TRELLO_KEY}, dĺžka tokenu: ${#TRELLO_TOKEN}"
          curl -fsS -G "https://api.trello.com/1/boards/$BOARD_ID/lists" \
            --data-urlencode "key=$TRELLO_KEY" \
            --data-urlencode "token=$TRELLO_TOKEN" \
            -d "cards=open" -d "card_fields=name,due,dueComplete,badges" -d "fields=name" \
            -o trello.json

      - name: Stiahni históriu commitov
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for vetva in main 01-web-setup; do
            gh api "repos/${{ github.repository }}/commits?sha=$vetva&per_page=40" > "commity-$vetva.json"
          done
          jq -s '[.[][]]
            | unique_by(.sha)
            | map(select(.commit.author.name != "github-actions[bot]"))
            | sort_by(.commit.author.date)
            | reverse
            | .[:30]
            | map({sha: .sha[0:7], sprava: .commit.message[0:200], autor: (.author.login // .commit.author.name), datum: .commit.author.date, url: .html_url})' commity-*.json > commits.json
          rm commity-*.json

      - name: Ulož zmeny
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add trello.json commits.json
          git diff --cached --quiet && exit 0
          git commit -m "Aktualizácia Trella a histórie"
          git push
